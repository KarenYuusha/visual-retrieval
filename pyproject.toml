[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-retrieval"
version = "0.2.0"
description = "Shared video retrieval baselines and interactive query refinement"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.5.1+cu121", "torchvision==0.20.1+cu121",
  "numpy==1.26.4", "transformers==4.40.2", "huggingface-hub==0.23.4",
  "timm==1.0.3", "einops==0.8.0", "easydict==1.13",
  "opencv-python==4.10.0.84", "tqdm==4.66.4", "PyYAML==6.0.2",
  "ftfy==6.2.0", "h5py==3.12.1", "Pillow>=10,<12"
]

[project.optional-dependencies]
dev = ["pytest==8.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"visual_retrieval.models.iv2_vendor" = ["*.json", "LICENSE", "NOTICE.md"]
"visual_retrieval.models.clip4clip_vendor" = ["LICENSE", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "internvideo2_retrieval/tests"]
pythonpath = ["src", "internvideo2_retrieval"]
